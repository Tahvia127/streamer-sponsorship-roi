name: Collect Steam and Twitch snapshots

on:
  schedule:
    - cron: "17 * * * *"   # hourly, off the top of the hour to avoid queue spikes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-collector.txt

      - name: Install collector dependencies
        run: pip install -r requirements-collector.txt

      - name: Run collector
        env:
          PYTHONPATH: src
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python -m streamads.collect --sources steam twitch

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/collected
          if git diff --cached --quiet; then
            echo "No new data"
            exit 0
          fi
          git commit -m "Snapshot $(date -u +'%Y-%m-%dT%H:%MZ')"
          git pull --rebase
          git push
